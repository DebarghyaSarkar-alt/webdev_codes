<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" minlength="7" maxlength="15" required placeholder="sppnge"><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required minlength="8"><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>
        <input type="submit">
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br>
        <label for="title">Title:</label>
        <label for="Mr">Mr.</label>
        <input type="radio" id="Mr" name="title" value="Mr">
        <label for="Mrs">Mrs.</label>
        <input type="radio" id="Mrs" name="title" value="Mrs">
        <label for="Ms">Ms.</label>
        <input type="radio" id="Ms" name="title" value="Ms"><br>
        <label for="payment">Payment Method:</label>
        <select name="payment" id="payment">
            <option value="credit">Credit Card</option>
            <option value="debit">Debit Card</option>
            <option value="paypal">PayPal</option>
        </select><br>
        <label for="text">Additional Information:</label>
        <textarea id="text" name="text" rows="4" cols="50"></textarea><br>
        <label for="file">Upload File:</label>
        <input type="file" id="file" name="file"><br>
        <input type="reset">
    </form>
    
</body>
</html>
