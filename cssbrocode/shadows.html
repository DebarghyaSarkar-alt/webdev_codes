<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-shadow: 3px 3px 5px red,
                         -2px -2px 5px blue;
                         /* this is for text */
        }
        #shadow{
            width: 100px;
            height: 100px;
            background-color: lightgray;
            box-shadow: 3px 3px 5px rgb(0, 0, 0);
            /* box shadows foe other elements */
        }

    </style>
</head>
<body>
    <h1>Debarghya Sarkar</h1>
    <div id="shadow"></div>
</body>
</html>
